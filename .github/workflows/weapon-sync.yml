name: BF6 weapon audit and publish (every 4 hours)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_weapons.py'
      - '.github/workflows/weapon-sync.yml'
      - 'tests/test_weapon_sync.py'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weapon-data-sync
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synchronizer
        run: python -m py_compile scripts/sync_weapons.py
      - name: Validate TTK and tournament rules
        run: python -m unittest discover -s tests -v
      - name: Sync live BF6 weapons and compute differences
        run: python scripts/sync_weapons.py
      - name: Commit verified snapshots and reports
        shell: bash
        run: |
          git config user.name 'skyguy-weapon-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'Weapon database already current.'
          else
            git commit -m 'chore: daily BF6 weapon data audit and sync'
            git push origin HEAD:main
          fi
